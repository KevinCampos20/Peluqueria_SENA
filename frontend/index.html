<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Peluquería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="acceso">
    <section class="letrero">
      <h1>Pelu&shy;quería</h1>
      <p>Horarios y citas del salón, en un solo lugar.</p>
    </section>
    <section class="formulario">
      <form id="loginForm" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="sub">Usa el correo con el que te registraste.</p>
        <div class="campo"><label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" autocomplete="username" required></div>
        <div class="campo"><label for="contrasena">Contraseña</label>
          <div class="clave"><input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
            <button type="button" id="verClave" aria-pressed="false">Mostrar</button></div></div>
        <button type="submit" id="btnIngresar" class="btn">Ingresar</button>
        <p id="mensajeRespuesta" class="aviso" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
