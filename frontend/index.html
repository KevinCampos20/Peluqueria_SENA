<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accede a los horarios, turnos y la gestión de tu peluquería." />
    <meta name="theme-color" content="#0f0518" />
    <title>Iniciar sesión · Peluquería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body>
    <main class="acceso">
      <section class="letrero" aria-labelledby="titulo-marca">
        <div class="decoracion-fondo" aria-hidden="true"></div>
        <div class="letrero-contenido">
          <svg class="marca" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <path d="M20 4 8.12 15.88"></path>
            <path d="M14.47 14.48 20 20"></path>
            <path d="M8.12 8.12 12 12"></path>
          </svg>
          <h1 id="titulo-marca">Pelu&shy;quería</h1>
          <p>Horarios, turnos y gestión del salón, en un solo lugar.</p>
        </div>
      </section>

      <section class="formulario" aria-label="Acceso">
        <div class="caja-acceso">
          <div class="pestanas pestanas-acceso" id="pestanasAcceso" role="tablist" aria-label="Tipo de acceso"></div>

          <div id="panelAcceso" class="panel-dinamico" role="tabpanel" aria-live="polite">
            <noscript><p class="aviso err">Activa JavaScript para iniciar sesión.</p></noscript>
          </div>

          <details class="servidor">
            <summary>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              <span>Configuración del servidor</span>
            </summary>
            <div class="servidor-contenido">
              <div class="campo">
                <label for="urlApi">Dirección del backend API</label>
                <input type="url" id="urlApi" placeholder="http://localhost:3333" autocomplete="url" inputmode="url" spellcheck="false" />
              </div>
              <div class="acciones-fila">
                <button type="button" class="btn sec pequeno" id="guardarApi">Guardar cambios</button>
                <button type="button" class="btn sec pequeno" id="probarApi">Probar conexión</button>
              </div>
              <p class="aviso" id="avisoApi" role="status" aria-live="polite"></p>
            </div>
          </details>
        </div>
      </section>
    </main>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
