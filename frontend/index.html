<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · Peluquería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body>
    <main class="acceso">
      <section class="letrero">
        <h1>Pelu&shy;quería</h1>
        <p>Horarios y citas del salón, en un solo lugar.</p>
      </section>

      <section class="formulario">
        <div class="caja-acceso">
          <div class="pestanas pestanas-acceso" id="pestanasAcceso"></div>
          <div id="panelAcceso"></div>

          <details class="servidor">
            <summary>Configurar servidor</summary>
            <div class="campo">
              <label for="urlApi">Dirección del backend</label>
              <input type="url" id="urlApi" placeholder="http://localhost:3333" />
            </div>
            <button type="button" class="btn sec" id="guardarApi">Guardar</button>
            <button type="button" class="btn sec" id="probarApi">Probar conexión</button>
            <p class="aviso" id="avisoApi" role="status" aria-live="polite"></p>
          </details>
        </div>
      </section>
    </main>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
